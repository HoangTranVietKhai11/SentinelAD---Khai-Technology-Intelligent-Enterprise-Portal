{% extends 'base.html' %}
{% block title %}{{ page_title }} - SentinelAD{% endblock %}
{% block page_heading %}{{ page_title }}{% endblock %}
{% block nav_employees %}active{% endblock %}
{% block content %}
<div class="page-header">
  <div class="page-header-left"><h1>{{ page_title }}</h1></div>
  <a href="{% url 'employee_list' %}" class="btn-sentinel btn-secondary-sentinel"><i class="fas fa-arrow-left"></i> Quay lại</a>
</div>
<div class="card" style="max-width:700px">
  <div class="card-body">
    <form method="POST">
      {% csrf_token %}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div><label class="form-label">Mã nhân viên *</label><input type="text" name="employee_id" class="form-control" value="{{ emp.employee_id|default:'' }}" required></div>
        <div><label class="form-label">Họ và tên *</label><input type="text" name="full_name" class="form-control" value="{{ emp.full_name|default:'' }}" required></div>
        <div><label class="form-label">Email *</label><input type="email" name="email" class="form-control" value="{{ emp.email|default:'' }}" required></div>
        <div><label class="form-label">Số điện thoại</label><input type="text" name="phone" class="form-control" value="{{ emp.phone|default:'' }}"></div>
        <div><label class="form-label">Phòng ban</label>
          <select name="department" class="form-select"><option value="">-- Chọn phòng ban --</option>{% for d in departments %}<option value="{{ d.pk }}" {% if emp.department_id == d.pk %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select>
        </div>
        <div><label class="form-label">Chức danh</label><input type="text" name="position" class="form-control" value="{{ emp.position|default:'' }}"></div>
        <div><label class="form-label">Ngày vào làm</label><input type="date" name="hire_date" class="form-control" value="{{ emp.hire_date|date:'Y-m-d'|default:'' }}"></div>
        <div><label class="form-label">Trạng thái</label>
          <select name="status" class="form-select"><option value="active" {% if emp.status == "active" or not emp %}selected{% endif %}>Đang làm việc</option><option value="inactive" {% if emp.status == "inactive" %}selected{% endif %}>Nghỉ việc</option><option value="onleave" {% if emp.status == "onleave" %}selected{% endif %}>Nghỉ phép</option></select>
        </div>
      </div>
      <div style="margin-top:24px;display:flex;gap:10px">
        <button type="submit" class="btn-sentinel btn-primary-sentinel"><i class="fas fa-save"></i> Lưu</button>
        <a href="{% url 'employee_list' %}" class="btn-sentinel btn-secondary-sentinel">Hủy</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
