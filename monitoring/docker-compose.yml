version: "3.8"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: sentinelad_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: sentinelad_loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: sentinelad_promtail
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yml
      # Mount the Django logs directory from the host
      - ../sentinelad_portal/logs:/var/log/sentinelad
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: sentinelad_grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-llm-app
      - GF_FEATURE_TOGGLES_ENABLE=llmFeatures
      - GF_PLUGINS_GRAFANA_LLM_APP_OPENAI_URL=https://api.groq.com/openai/v1
      - GF_PLUGINS_GRAFANA_LLM_APP_OPENAI_KEY=${GROQ_API_KEY:-your_groq_api_key_here}
      - GF_PLUGINS_GRAFANA_LLM_APP_OPENAI_MODEL=llama-3.1-70b-versatile
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
