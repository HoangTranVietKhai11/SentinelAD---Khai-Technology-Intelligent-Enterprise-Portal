server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
- job_name: sentinelad_audit
  static_configs:
  - targets:
      - localhost
    labels:
      job: sentinelad_audit
      __path__: /var/log/sentinelad/sentinelad_audit.log
  pipeline_stages:
  - json:
      expressions:
        time: time
        level: level
        logger: logger
        message: message
  - timestamp:
      source: time
      format: "2006-01-02 15:04:05,000"
      location: "Asia/Ho_Chi_Minh"
  - output:
      source: message
